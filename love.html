<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моей любимой 💖</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(238, 156, 167, 0.4);
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
        .main-emoji {
            font-size: 70px;
            display: inline-block;
            animation: pulse 1.2s infinite alternate ease-in-out;
            margin-bottom: 10px;
        }
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,77,109,0.3)); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 15px rgba(255,77,109,0.8)); }
        }
        h1 {
            color: #ff3366;
            font-size: 26px;
            margin-bottom: 12px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 50px;
            position: relative;
        }
        .btn {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s, box-shadow 0.3s;
        }
        .btn-yes {
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }
        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.6);
        }
        .btn-no {
            background-color: #e0e0e0;
            color: #777;
            position: absolute;
            transition: all 0.2s ease;
        }
        #love-response {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.8s forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .secret-card {
            background: #fff0f3;
            border: 2px dashed #ff758f;
            padding: 20px;
            border-radius: 20px;
            color: #a4133c;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.6;
        }
        .floating-heart {
            position: fixed;
            top: -10vh;
            pointer-events: none;
            z-index: 1;
            animation: floatDown linear forwards;
        }
        @keyframes floatDown {
            to {
                transform: translateY(115vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="main-emoji" id="icon">🧸</div>
        <h1>Привет, моя медвежонка</h1>
        <p id="description">У меня есть к тебе один очень важный вопрос...</p>

        <div class="buttons-container" id="btn-group">
            <button class="btn btn-yes" onclick="acceptLove()">Да! 💖</button>
            <button class="btn btn-no" id="no-btn" onmouseover="moveButton()" onclick="moveButton()">Нет 😜</button>
        </div>

        <div id="love-response">
            <div class="secret-card">
                Урааа🥰 У тебя просто не было шансов сказать «нет» 😉<br><br>
                Ты делаешь каждый мой день счастливее. Я полностью верю в тебя и знаю, что у тебя всё получится. Помни: ты не одна, я всегда рядом с тобой.<br><br>
                Безумно люблю тебя, my wife 💖✨
            </div>
        </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('no-btn');
            // Ограничиваем случайное перемещение в пределах видимой зоны
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function acceptLove() {
            document.getElementById('icon').innerHTML = '💖';
            document.getElementById('description').innerText = 'Я так и знал! 🥰';
            document.getElementById('btn-group').style.display = 'none';
            document.getElementById('love-response').style.display = 'block';

            // Запуск вала сердечек
            for (let i = 0; i < 40; i++) {
                setTimeout(createHeart, i * 120);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            const hearts = ['❤️', '💖', '💕', '🌸', '✨', '🎀', '🧸'];
            heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
            heart.style.fontSize = (Math.random() * 15 + 20) + 'px';
            
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4500);
        }
    </script>

</body>
</html>
